<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orca Web — Connexion</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --bg:#1d1f21; --panel:#2a2d30; --text:#e6e6e6; --muted:#9aa0a6; --accent:#009688; --err:#ef5350; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { background:var(--panel); padding:32px 28px; border-radius:12px; width:100%; max-width:340px;
         box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { margin:0 0 4px; font-size:22px; display:flex; align-items:center; gap:10px; }
  p { margin:0 0 22px; color:var(--muted); font-size:13px; }
  input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid #444; background:#1a1c1e; color:var(--text);
          font-size:15px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { margin-top:14px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--err); font-size:13px; min-height:18px; margin-top:10px; }
</style>
</head>
<body>
<form id="f">
  <h1><svg width="28" height="28" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#009688"/><path d="M14 38c6-14 30-20 38-6-8-3-15 2-19 8-5-4-12-5-19-2z" fill="#fff"/></svg>Orca Web</h1>
  <p>OrcaSlicer dans le navigateur, connecté à la QIDI.</p>
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" autofocus required>
  <button id="b" type="submit">Se connecter</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) { location.href = '/'; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.detail || 'Erreur de connexion';
  } catch { err.textContent = 'Serveur injoignable'; }
  b.disabled = false;
});
</script>
</body>
</html>
